name: Staleness Review

# Thin caller stub (skills #382). The loop body lives once in dividedby/skills,
# pinned to tag @claude-loops-v1; it resolves fresh per run. Per-repo here: the
# cron and the issues:write grant. A called workflow can't be granted more token
# scope than the caller holds and this repo's default is read-only, so the
# permissions grant is required or the run startup-fails.

on:
  schedule:
    # First Monday of the month, 13:09 UTC = 08:09 CT. Hand-chosen slot in the
    # staleness 13:xx UTC band (skills ADR 0022 staggers only the 3×/week loops).
    - cron: "9 13 * * 1"
  workflow_dispatch:

jobs:
  run:
    permissions:
      contents: read
      issues: write
    uses: dividedby/skills/.github/workflows/staleness-review-reusable.yml@claude-loops-v1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
