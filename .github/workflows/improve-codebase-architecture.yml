name: Improve Codebase Architecture

# Thin caller stub (skills #382). The loop body lives once in dividedby/skills,
# pinned to tag @claude-loops-v1; it resolves fresh per run. Per-repo here: the
# cron and the issues:write grant. A called workflow can't be granted more token
# scope than the caller holds and this repo's default is read-only, so the
# permissions grant is required or the run startup-fails.

on:
  schedule:
    # 01:34 UTC Mon/Wed/Sat = 20:34 CT Sun/Tue/Fri. 3×/week (skills ADR 0022
    # hash-stagger slot within the 00–04 UTC evening-CT band).
    - cron: "34 1 * * 1,3,6"
  workflow_dispatch:

jobs:
  run:
    permissions:
      contents: read
      issues: write
    uses: dividedby/skills/.github/workflows/improve-codebase-architecture-reusable.yml@claude-loops-v1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
