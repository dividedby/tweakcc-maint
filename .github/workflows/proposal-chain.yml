# Auto-adopt chain: labeled proposal → Integration-gate dispatch (slice 4, #200).
#
# Thin chain envelope (mirrors release-detector.yml → src/release-detector-cli.ts,
# and integration-gate.yml → src/cli.ts): it carries NO business logic. When an
# `adopt CC X.Y.Z` proposal gets the ready-for-agent label, this runs the slice-4
# entry point, which parses the proposal's `cc_version` marker and dispatches
# integration-gate.yml for it — with NO human approval step. The gate itself posts
# the Adoption record back onto the proposal (in-gate write-back step, additive).
#
# Once per proposal: the entry point leaves a machine-readable dispatch comment and
# short-circuits if one already exists, so a re-applied label can't re-dispatch the
# gate (bounded unattended spend). No `claude -p` runs here (the gate runs it), so
# there is no cost-ledger wiring in this workflow.
name: proposal-chain

on:
  issues:
    types: [labeled]

# Only react to the proposal label the detector stamps (issue-publisher.ts →
# PROPOSAL_LABEL). Any other label-add is ignored cheaply.
jobs:
  dispatch-gate:
    if: github.event.label.name == 'ready-for-agent'
    runs-on: ubuntu-latest
    permissions:
      # actions: write to `gh workflow run` the gate; issues: write for the
      # once-per-proposal dispatch-marker comment. No other scope.
      actions: write
      issues: write
      contents: read
    env:
      # The entry point shells `gh` (read the proposal's comments for the once-guard,
      # `gh workflow run` the gate, leave the dispatch-marker comment). In Actions
      # `gh` authenticates from GH_TOKEN.
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
    steps:
      - name: Checkout tweakcc-maint
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2  # exact pin; satisfies devEngines.packageManager (pnpm ^11.5.2)
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The whole job: run the slice-4 entry point. It parses the marker, applies the
      # once-per-proposal guard, and dispatches the gate. Logic stays in tsx.
      - name: Dispatch the Integration gate for the proposal
        run: pnpm tsx src/proposal-chain-cli.ts
