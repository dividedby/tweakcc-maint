# Integration gate on GitHub-hosted CI (ADR 0006).
#
# Runs the same environment-agnostic gate as locally — `pnpm tsx src/cli.ts` —
# on the maintainer's fork (never skrabe's leaf repos; contributor cockpit).
# The matrix is installed-version-only, so `cc_version` IS the Support matrix:
# install that Claude Code version, the gate discovers it via `claude --version`.
name: integration-gate

on:
  workflow_dispatch:
    inputs:
      cc_version:
        description: "Claude Code version to adopt-test (e.g. 2.1.169)"
        required: true
        type: string
      # Fork-branch gating: supply these four inputs to clone an unmerged fork
      # branch instead of skrabe's main. Leave all four empty for default behavior
      # (clones skrabe/<repo>@main — byte-for-byte equivalent to the prior hardcoded clone).
      tweakcc_fixed_repo:
        description: "tweakcc-fixed repo to clone (owner/repo, default: skrabe/tweakcc-fixed)"
        required: false
        default: "skrabe/tweakcc-fixed"
        type: string
      tweakcc_fixed_ref:
        description: "tweakcc-fixed ref/branch to clone (default: main)"
        required: false
        default: "main"
        type: string
      lobotomized_repo:
        description: "lobotomized-claude-code repo to clone (owner/repo, default: skrabe/lobotomized-claude-code)"
        required: false
        default: "skrabe/lobotomized-claude-code"
        type: string
      lobotomized_ref:
        description: "lobotomized-claude-code ref/branch to clone (default: main)"
        required: false
        default: "main"
        type: string
      proposal_issue:
        # When set, the gate posts the Adoption record back as an ADDITIVE comment
        # on that proposal issue. Left empty for a plain manual gate run → no write-back.
        description: "Proposal issue to write the Adoption record back to (optional)"
        required: false
        type: string
      isolate_overrides:
        # Isolate the lobotomized override surfaces so the record reflects only the
        # patcher+prompts Four-zeros for the tweakcc-fixed branch under test; use when
        # gating a tweakcc-fixed-only fork branch against possibly-stale lobotomized overrides.
        description: "Isolate lobotomized override surfaces for a clean patcher+prompts Four-zeros record"
        required: false
        default: false
        type: boolean

# `issues: write` is only exercised by the write-back step, and only when
# proposal_issue is set (the auto-chain path); a manual run leaves it unused.
permissions:
  contents: read
  issues: write

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      # The gate reads credentials from the environment (ADR 0003); either authenticates
      # `claude -p` headlessly (ADR 0006), checked CLAUDE_CODE_OAUTH_TOKEN-first to match
      # src/cli.ts. Set whichever you generated as a repo secret on the fork.
      # DISABLE_AUTOUPDATER pins the installed CC version so the cache key stays honest.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DISABLE_AUTOUPDATER: "1"
      # Boot-verify (headless claude -p) appends its raw stream-json here; the post-gate
      # step surfaces total_cost_usd from it for the cross-repo cost ledger (agent-research).
      GATE_AGENT_LOG: ${{ github.workspace }}/agent.jsonl
      # Pin the leaf's config/backup dir explicitly so tweakcc-fixed (getConfigDir checks this
      # first) and the gate's restore-drill agree — otherwise the leaf's fallback resolution
      # (~/.claude/tweakcc once claude creates ~/.claude) diverges from the gate → missing-backup.
      TWEAKCC_CONFIG_DIR: ${{ github.workspace }}/.tweakcc
      TWEAKCC_FIXED_DIR: ${{ github.workspace }}/leaves/tweakcc-fixed
      LOBOTOMIZED_DIR: ${{ github.workspace }}/leaves/lobotomized-claude-code
    steps:
      - name: Guard — require a license secret
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ] && [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set on this fork; Boot-verify cannot run." >&2
            exit 1
          fi

      - name: Checkout tweakcc-maint
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2  # exact pin; satisfies devEngines.packageManager (pnpm ^11.5.2)
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # --- Leaf clones (read-only; the control plane never pushes to skrabe) ---
      - name: Clone leaf repos
        run: |
          git clone --depth 1 --branch "${{ inputs.tweakcc_fixed_ref }}" https://github.com/${{ inputs.tweakcc_fixed_repo }} "${TWEAKCC_FIXED_DIR}"
          git clone --depth 1 --branch "${{ inputs.lobotomized_ref }}" https://github.com/${{ inputs.lobotomized_repo }} "${LOBOTOMIZED_DIR}"

      # Always install + build: the gate runs the leaf's dist/index.mjs, which needs its
      # runtime node_modules (ink, etc.) present. Caching only dist while gating the
      # install behind that cache left a dist with no node_modules. pnpm's symlinked
      # node_modules is fragile to cache, so we rebuild fresh each run (on-demand workflow).
      - name: Install + build tweakcc-fixed (the gate runs its dist/index.mjs)
        working-directory: ${{ env.TWEAKCC_FIXED_DIR }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # --- Pinned Claude Code binary (CI owns install + cache; ADR 0006) ---
      - name: Cache Claude Code ${{ inputs.cc_version }}
        id: cc-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/bin/claude
            ~/.local/share/claude
          key: claude-code-${{ inputs.cc_version }}

      - name: Install Claude Code ${{ inputs.cc_version }}
        if: steps.cc-cache.outputs.cache-hit != 'true'
        run: curl -fsSL https://claude.ai/install.sh | bash -s "${{ inputs.cc_version }}"

      - name: Put Claude Code on PATH and verify the pin
        run: |
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/claude" --version

      # Seed the strings file from the freshly-installed native binary, NOT the --apply cache (#211,
      # #228). This step runs BEFORE the gate's first --apply, so the native binary is pristine
      # (never patched). It writes prompts-<version>.json into tweakcc-fixed/data/prompts — the first
      # source resolveStringsFilePath prefers — so the gate's driver + orphan checks read a pristine
      # identifierMap rather than one sourced from a patched tree (the lcc#9 / 2.1.172
      # contamination). The patched-vs-pristine guard runs inside this step and fails closed.
      # CC_NATIVE_BINARY defaults to ~/.local/bin/claude (where the install step above puts it).
      - name: Seed the PRISTINE strings file (native binary, never --apply)
        env:
          CC_VERSION: ${{ inputs.cc_version }}
        run: pnpm tsx src/pristine-extract-cli.ts

      # The Restore drill (#23) fails closed unless a stock backup exists before apply.
      # On an ephemeral runner the fresh install has none, so seed it the way the runbook
      # prerequisites do: one --apply creates tweakcc-fixed's stock backup under ~/.tweakcc,
      # then --restore returns CC to clean stock for the gate. The strings file is already
      # seeded pristine above, so the --apply cache it also writes is no longer the gate's source.
      - name: Seed the stock backup (runbook prereq)
        run: |
          node "${TWEAKCC_FIXED_DIR}/dist/index.mjs" --apply
          node "${TWEAKCC_FIXED_DIR}/dist/index.mjs" --restore

      # --- The gate: real apply -> Boot-verify -> Orphan check, bracketed by Restore drill ---
      - name: Run the Integration gate
        env:
          ISOLATE_OVERRIDES: ${{ inputs.isolate_overrides }}
        run: |
          # pipefail so the gate's non-zero exit (pass:false) fails the job — `tee`
          # alone would mask it and turn a red gate into a green run.
          set -o pipefail
          pnpm tsx src/cli.ts | tee adoption-record.json

      # Surface the Agent-SDK cost onto stdout so it lands in the Actions log, where the
      # agent-research cost ledger scrapes `total_cost_usd`. Boot-verify's stdout is the
      # gate's reserved JSON record, so the cost comes from the GATE_AGENT_LOG sidecar.
      - name: Surface Agent-SDK cost to the run log
        if: always()
        run: |
          if [ -s "${GATE_AGENT_LOG}" ]; then
            total=$(jq -rs '[.[] | select(.type=="result") | .total_cost_usd // empty] | add // 0' "${GATE_AGENT_LOG}")
            turns=$(jq -rs '[.[] | select(.type=="result") | .num_turns // empty] | add // 0' "${GATE_AGENT_LOG}")
            echo "total_cost_usd=${total}"
            echo "num_turns=${turns}"
          else
            echo "total_cost_usd=0"
            echo "num_turns=0"
            echo "::notice::No agent stream captured (no successful Boot-verify model call this run)."
          fi

      # Write-back: when proposal_issue is set, post the Adoption record + pass/fail
      # back onto that proposal as an ADDITIVE comment — never a body rewrite, never
      # an auto-close (cockpit rule). Logic lives in src/writeback-cli.ts; this is a
      # thin envelope. `if: always()` so a RED gate still reports its verdict; a
      # missing record reads as a FAIL (writeback-cli), never a silent pass.
      - name: Write the Adoption record back to the proposal
        if: always() && inputs.proposal_issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.proposal_issue }}
          CC_VERSION: ${{ inputs.cc_version }}
          ADOPTION_RECORD_PATH: ${{ github.workspace }}/adoption-record.json
        run: pnpm tsx src/writeback-cli.ts

      - name: Upload Adoption record + agent stream (PR evidence)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: adoption-record-${{ inputs.cc_version }}
          path: |
            adoption-record.json
            agent.jsonl
          if-no-files-found: warn
